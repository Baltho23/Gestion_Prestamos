<div class="flex min-h-screen items-center justify-center bg-slate-100 px-4">
  <div class="w-full max-w-sm rounded-2xl bg-white p-8 shadow-xl ring-1 ring-slate-200">
    <h1 class="text-xl font-semibold text-slate-900">Sistema de Préstamos</h1>
    <p class="mt-1 text-sm text-slate-500">Ingresa con tu correo y contraseña.</p>

    <form class="mt-6 space-y-4" [formGroup]="form" (ngSubmit)="enviar()">
      <div>
        <label for="email" class="block text-sm font-medium text-slate-700">Correo</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="username"
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-900 focus:ring-1 focus:ring-slate-900"
        />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <p class="mt-1 text-xs text-red-600">Ingresa un correo válido.</p>
        }
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-slate-700">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-900 focus:ring-1 focus:ring-slate-900"
        />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <p class="mt-1 text-xs text-red-600">La contraseña es obligatoria.</p>
        }
      </div>

      <button
        type="submit"
        [disabled]="enviando()"
        class="w-full rounded-lg bg-slate-900 px-4 py-2 text-sm font-medium text-white transition hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ enviando() ? 'Ingresando…' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
