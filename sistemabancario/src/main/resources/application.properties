# =====================================================================
#  Perfil por defecto: H2 en memoria — arranque inmediato, sin instalar
#  ni configurar nada. Ideal para evaluar el proyecto.
#
#  Para ejecutar contra PostgreSQL (production-like):
#     ./gradlew bootRun --args='--spring.profiles.active=postgres'
# =====================================================================

# --- Base de datos: H2 en memoria, en modo de compatibilidad PostgreSQL ---
spring.datasource.url=jdbc:h2:mem:sistema_bancario;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2: Hibernate genera el esquema a partir de las entidades en cada arranque
spring.jpa.hibernate.ddl-auto=create-drop

# La semilla (data.sql) se ejecuta DESPUÉS de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# --- JPA / Hibernate (común a ambos perfiles) ---
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- App ---
server.port=8080

# --- Caché (EHCache vía JCache) ---
spring.cache.type=jcache
spring.cache.jcache.provider=org.ehcache.jsr107.EhcacheCachingProvider
spring.cache.jcache.config=classpath:ehcache.xml

# --- JWT ---
jwt.secret=c2VjcmV0LWtleS1wYXJhLXRlc3Rlcy10ZWNuaWNhLW1ha2Vycw==
jwt.expiration=86400000
